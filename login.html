<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <!-- Logo -->
        <img src="logo.webp" alt="Restaurant Logo" class="logo">

        <!-- Title -->
        <h2>Welcome Back</h2>
        <p class="tagline">Login to continue ordering delicious meals 🍽️</p>

        <!-- Login Form -->
        <form method="POST" action="#">
            <input 
                type="email" 
                name="email" 
                placeholder="Enter your email" 
                required
            >

            <input 
                type="password" 
                name="password" 
                placeholder="Enter your password" 
                required
            >

            <button type="submit">Login</button>
        </form>

        <!-- Links -->
        <p class="links">
            New user? <a href="signup.html">Sign Up</a>
        </p>

    </div>

</body>
</html>
